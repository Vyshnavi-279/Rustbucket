name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/requirements.txt') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff
        if: ${{ hashFiles('backend/requirements.txt') != '' }}
        run: ruff check backend

      - name: Pytest
        if: ${{ hashFiles('backend/requirements.txt') != '' }}
        run: pytest backend -m "not network"

     scanner:
    name: Scanner checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanner dependencies
        if: ${{ hashFiles('scanner/requirements.txt') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/requirements.txt

      - name: Ruff
        if: ${{ hashFiles('scanner/requirements.txt') != '' }}
        run: ruff check scanner

      - name: Pytest
        if: ${{ hashFiles('scanner/requirements.txt') != '' }}
        run: pytest scanner -m "not network"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm test