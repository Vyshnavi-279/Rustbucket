name: Build and Scan Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff
        run: ruff check backend

      - name: Pytest
        run: pytest backend -m "not network"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend test
        working-directory: frontend
        run: npm test

  build-scan:
    name: Build and Scan
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: infra/docker/backend.Dockerfile
          - service: worker
            dockerfile: infra/docker/worker.Dockerfile
          - service: frontend
            dockerfile: infra/docker/frontend.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: rustbucket-${{ matrix.service }}:${{ github.sha }}
          load: true
          push: false

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rustbucket-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Save image
        run: |
          docker save rustbucket-${{ matrix.service }}:${{ github.sha }} \
            -o rustbucket-${{ matrix.service }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustbucket-${{ matrix.service }}-image
          path: rustbucket-${{ matrix.service }}.tar

  push:
    name: Push to GHCR
    needs: build-scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: infra/docker/backend.Dockerfile
          - service: worker
            dockerfile: infra/docker/worker.Dockerfile
          - service: frontend
            dockerfile: infra/docker/frontend.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: 
            push:
    name: Push to GHCR
    needs: build-scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: infra/docker/backend.Dockerfile
          - service: worker
            dockerfile: infra/docker/worker.Dockerfile
          - service: frontend
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: rustbucket-${{ matrix.service }}-image

      - name: Load scanned image
        run: docker load -i rustbucket-${{ matrix.service }}.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          SRC=rustbucket-${{ matrix.service }}:${{ github.sha }}
          SHA_TAG=ghcr.io/${{ github.repository_owner }}/rustbucket-${{ matrix.service }}:${{ github.sha }}
          LATEST_TAG=ghcr.io/${{ github.repository_owner }}/rustbucket-${{ matrix.service }}:latest
          docker tag "$SRC" "$SHA_TAG"
          docker tag "$SRC" "$LATEST_TAG"
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"