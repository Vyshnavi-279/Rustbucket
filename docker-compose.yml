services:
  redis:
    image: redis:7-alpine
    container_name: rustbucket-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rustbucket-network

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: rustbucket-backend
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      SCANNER_MODE: ${SCANNER_MODE:-stub}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rustbucket-network

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: rustbucket-worker
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      SCANNER_MODE: ${SCANNER_MODE:-stub}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rustbucket-network

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: rustbucket-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rustbucket-network

networks:
  rustbucket-network:
    driver: bridge
    
