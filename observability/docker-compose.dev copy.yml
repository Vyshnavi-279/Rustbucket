services:
  backend:
    build:
      context: ./dev
      dockerfile: Dockerfile.fake
    command: ["--mode", "backend", "--port", "8000"]
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./dev
      dockerfile: Dockerfile.fake
    command: ["--mode", "worker", "--port", "8001"]
    ports:
      - "8001:8001"