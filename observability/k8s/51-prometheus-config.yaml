apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rustbucket
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8000"]

      - job_name: worker
        metrics_path: /metrics
        static_configs:
          - targets: ["worker:8001"]

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]