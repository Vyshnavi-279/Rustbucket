apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: rustbucket
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: rustbucket
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: Rustbucket
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        allowUiUpdates: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards