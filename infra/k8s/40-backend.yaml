apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rustbucket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/vyshnavi-279/rustbucket-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rustbucket-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rustbucket-secrets
                  key: DATABASE_URL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rustbucket-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rustbucket
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
