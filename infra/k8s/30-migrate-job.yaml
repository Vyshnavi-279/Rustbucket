apiVersion: batch/v1
kind: Job
metadata:
  name: rustbucket-migrate
  namespace: rustbucket
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/<owner>/rustbucket-backend:latest
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: rustbucket-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rustbucket-secrets
                  key: DATABASE_URL