apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: rustbucket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/vyshnavi-279/rustbucket-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rustbucket-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rustbucket-secrets
                  key: DATABASE_URL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rustbucket-secrets
                  key: GITHUB_TOKEN
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: rustbucket
spec:
  selector:
    app: worker
  ports:
    - port: 8001
      targetPort: 8001